<div class="shell" id="shell">
  <header class="appbar">
    <a class="brand" href="#/overview" title="番剧中枢 · Bangumi Nexus">
      <img class="brand-mark" src="./assets/logo.svg" alt="" width="30" height="30" draggable="false" />
      <span class="brand-text">
        <strong>番剧中枢</strong>
        <small id="brand-sub">跨源检索 · 追番清单 · RSS 订阅 · 每日播报</small>
      </span>
    </a>

    <div class="appbar-actions">
      <div class="theme-picker">
        <button class="pill-btn" id="btn-theme" type="button" aria-haspopup="true" aria-expanded="false" title="切换界面主题（同时决定卡片预览配色）">
          <span class="swatches" id="theme-swatch"></span>
          <span id="theme-label">午夜霓虹</span>
          <svg class="icon sm"><use href="#i-caret"></use></svg>
        </button>
        <div class="theme-menu" id="theme-menu" role="menu" hidden></div>
      </div>
      <button class="pill-btn" id="btn-dense" type="button" title="紧凑模式：压缩间距，一屏塞更多东西">
        <svg class="icon sm"><use href="#i-compact"></use></svg><span>紧凑</span>
      </button>
      <button class="pill-btn" id="btn-refresh" type="button" title="重新拉取运行概览与当前视图数据">
        <svg class="icon sm"><use href="#i-refresh"></use></svg><span>刷新</span>
      </button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>

  <main class="views" id="views">
    <section class="view" data-view="overview" hidden></section>
    <section class="view" data-view="config" hidden></section>
    <section class="view" data-view="watch" hidden></section>
    <section class="view" data-view="subs" hidden></section>
    <section class="view" data-view="targets" hidden></section>
    <section class="view" data-view="anirss" hidden></section>
    <section class="view" data-view="cards" hidden></section>
    <section class="view" data-view="sources" hidden></section>
    <section class="view" data-view="commands" hidden></section>
    <section class="view" data-view="about" hidden></section>
  </main>

  <footer class="statusbar">
    <span class="status-left" id="status-left"></span>
    <span class="status-right" id="status-right"></span>
  </footer>
</div>

<div class="boot" id="boot">
  <img src="./assets/logo.svg" alt="" width="64" height="64" draggable="false" />
  <p>正在连接 AstrBot…</p>
</div>

<!-- 自绘确认框：插件页跑在 sandbox iframe 里（AstrBot 给的是
     「allow-scripts allow-forms allow-downloads」，没有 allow-modals），
     window.confirm 会被浏览器直接判否而且什么都不弹，所以危险操作只能自己画。 -->
<div class="askbox" id="askbox" hidden>
  <div class="askbox-card" role="alertdialog" aria-modal="true" aria-labelledby="askbox-title" aria-describedby="askbox-body">
    <div class="askbox-head">
      <span class="askbox-mark" id="askbox-mark"><svg class="icon"><use href="#i-info"></use></svg></span>
      <h2 id="askbox-title"></h2>
    </div>
    <p id="askbox-body"></p>
    <div class="askbox-actions">
      <button class="btn ghost" id="askbox-no" type="button"></button>
      <button class="btn primary" id="askbox-yes" type="button"></button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
